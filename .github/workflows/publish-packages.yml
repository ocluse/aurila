name: Publish Packages

on:
  push:
    branches: ["main"]
    paths:
      - "Aurila/**"
      - "Aurila.Web/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies (Aurila)
        run: npm ci
        working-directory: ./Aurila

      - name: Install npm dependencies (Aurila.Web)
        run: npm ci
        working-directory: ./Aurila.Web

      - name: Restore dependencies
        run: dotnet restore ./Aurila.Web/Aurila.Web.csproj

      - name: Build packages
        run: dotnet build ./Aurila.Web/Aurila.Web.csproj --no-restore -c Release

      - name: Run tests (if present)
        shell: bash
        run: |
          shopt -s globstar nullglob
          test_projects=(**/*[Tt]est*.csproj **/*[Tt]ests*.csproj)

          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No test projects found, skipping test run."
            exit 0
          fi

          for project in "${test_projects[@]}"; do
            dotnet test "$project" --no-build -c Release
          done

      - name: Publish to NuGet
        run: dotnet nuget push "./build/*.nupkg" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./build/*.nupkg" -k ${{ secrets.GITHUB_TOKEN }} -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
